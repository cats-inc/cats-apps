name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check repository documentation
        run: npm run check:docs

# Add app build/tests and artifact production with PLAN-001.
# This workflow neither publishes releases nor installs apps into a user profile.
