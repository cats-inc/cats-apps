name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check repository documentation
        run: npm run check:docs
      - name: Test App build and usage presentation
        run: npm test
      - name: Build versioned Usage package
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: usage-package
          path: dist/*
          if-no-files-found: error

# This workflow neither publishes releases nor installs apps into a user profile.
