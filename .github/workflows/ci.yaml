name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A change confined to docs/ still runs the Markdown link check but skips App
  # tests, the package build and its artifact. Any other path or a failed
  # detection runs every step. tests/docs-boundary.test.mjs keeps tests,
  # scripts and App sources from reading docs/.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          code=true
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            if [ -n "$changed" ] && ! grep -qv '^docs/' <<< "$changed"; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  documentation:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check repository documentation
        run: npm run check:docs
      - name: Test App build and usage presentation
        if: needs.changes.outputs.code != 'false'
        run: npm test
      - name: Build versioned Usage package
        if: needs.changes.outputs.code != 'false'
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.code != 'false'
        with:
          name: usage-package
          path: dist/*
          if-no-files-found: error

# This workflow neither publishes releases nor installs apps into a user profile.
